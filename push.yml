name: Push to Replicate

on:
  push:
    branches:
      - main

jobs:
  push_to_replicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_CLI_AUTH_TOKEN }}
      - run: cog push r8.im/tafmannn/mixmaster-ai
