name: mixmaster-ai
description: AI-powered mixing and mastering tool with genre-specific DSP and stem export.
inputs:
  audio_file:
    type: file
    description: "Input audio file (.wav or .mp3). Can be a full mix or zipped stems."
  genre:
    type: string
    default: "hiphop"
    enum: ["hiphop", "edm", "pop", "rock"]
  target_lufs:
    type: number
    default: -8.0
outputs:
  master_output:
    type: file
  stem_outputs:
    type: array
    items:
      type: file